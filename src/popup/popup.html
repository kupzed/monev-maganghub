<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagangHub AI Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon-32.png" alt="Logo" class="logo">
        <div>
          <h1 class="title">MagangHub AI <span class="badge">PRO</span></h1>
          <p class="subtitle">Asisten Laporan Harian Magang</p>
        </div>
      </div>
      <button id="btnOpenOptions" class="icon-btn" title="Buka Pengaturan & Riwayat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner info">
      <div class="status-indicator"></div>
      <div class="status-text" id="statusText">Memeriksa konfigurasi...</div>
      <button id="statusActionBtn" class="status-action hidden">Atur</button>
    </div>

    <!-- Quick Navigation Bar -->
    <div class="action-grid">
      <button id="btnOpenMonev" class="btn-portal">
        <span class="portal-icon">🚀</span>
        <div class="portal-info">
          <span class="portal-title">Buka Monev Hari Ini</span>
          <span class="portal-desc" id="currentDateStr">Kemnaker MagangHub</span>
        </div>
      </button>
    </div>

    <!-- Generator Section -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">✨ Generator Cepat</span>
        <div class="dropdown-container">
          <select id="selectPreset" class="preset-select">
            <option value="">-- Pilih Template Cepat --</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <textarea id="bulletsInput" rows="4" placeholder="Ketik ringkasan kegiatan hari ini...&#10;Contoh:&#10;- Morning briefing tim&#10;- Slicing form frontend&#10;- Diskusi kendala API"></textarea>
      </div>

      <div class="generator-footer">
        <button id="btnGenerate" class="btn-primary">
          <span class="btn-icon">⚡</span>
          <span class="btn-label">Generate Laporan</span>
        </button>
      </div>
    </div>

    <!-- Live Preview Result -->
    <div id="resultCard" class="card result-card hidden">
      <div class="card-header">
        <span class="card-title">📋 Hasil Laporan AI</span>
        <button id="btnCopyAll" class="btn-secondary btn-sm">Salin Semua</button>
      </div>

      <div class="result-section">
        <div class="section-title">
          <span>1. Aktivitas</span>
          <span class="char-count" id="countAktivitas">0 char</span>
        </div>
        <textarea id="resAktivitas" class="result-textarea" rows="3"></textarea>
        <div class="section-actions">
          <button class="btn-copy-mini" data-target="resAktivitas">Salin Aktivitas</button>
        </div>
      </div>

      <div class="result-section">
        <div class="section-title">
          <span>2. Pembelajaran</span>
          <span class="char-count" id="countPembelajaran">0 char</span>
        </div>
        <textarea id="resPembelajaran" class="result-textarea" rows="3"></textarea>
        <div class="section-actions">
          <button class="btn-copy-mini" data-target="resPembelajaran">Salin Pembelajaran</button>
        </div>
      </div>

      <div class="result-section">
        <div class="section-title">
          <span>3. Kendala & Solusi</span>
          <span class="char-count" id="countKendala">0 char</span>
        </div>
        <textarea id="resKendala" class="result-textarea" rows="3"></textarea>
        <div class="section-actions">
          <button class="btn-copy-mini" data-target="resKendala">Salin Kendala</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-hint">Tip: Buka halaman MagangHub untuk isi otomatis via tombol melayang.</span>
    </footer>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="../utils/templates.js"></script>
  <script src="../utils/gemini.js"></script>
  <script src="popup.js"></script>
</body>
</html>
